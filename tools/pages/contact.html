<section class="sheet section" aria-labelledby="c-form">
    <div class="wrap contact-grid">
      <form class="enquiry" id="enquiry-form" action="https://formspree.io/f/mljbrboz" method="POST" data-endpoint="https://formspree.io/f/mljbrboz" novalidate aria-labelledby="c-form">
        <h2 id="c-form" class="visually-hidden">Enquiry form</h2>
        <fieldset>
          <legend>What’s this about?</legend>
          <div class="routes">
            <div class="route"><input type="radio" name="route" id="r-cobuild" value="cobuild" data-label="Venture co-build or partnership" checked><label for="r-cobuild"><span class="r-mark" aria-hidden="true"></span><span class="r-name">Build something together</span><span class="r-desc">You know a problem first-hand, or your business works in one of these areas.</span></label></div>
            <div class="route"><input type="radio" name="route" id="r-venture" value="venture" data-label="Question about a project"><label for="r-venture"><span class="r-mark" aria-hidden="true"></span><span class="r-name">One of the projects</span><span class="r-desc">Press, investment, or a question about {{ventureNames}}.</span></label></div>
            <div class="route"><input type="radio" name="route" id="r-advisory" value="advisory" data-label="Selective strategic advisory"><label for="r-advisory"><span class="r-mark" aria-hidden="true"></span><span class="r-name">Advisory work</span><span class="r-desc">A product or digital job, usually for a Canberra agency or business.</span></label></div>
          </div>
        </fieldset>

        <div class="field-row">
          <div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" required aria-describedby="name-err"><span class="err" id="name-err" aria-live="polite"></span></div>
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-err"><span class="err" id="email-err" aria-live="polite"></span></div>
        </div>
        <div class="field"><label for="organisation">Organisation <span class="opt">(optional)</span></label><input id="organisation" name="organisation" autocomplete="organization"></div>
        <div class="field"><label for="message">What’s it about?</label><textarea id="message" name="message" required aria-describedby="message-err" placeholder="What’s the problem, who’s it affecting, and where’s it at?"></textarea><span class="err" id="message-err" aria-live="polite"></span></div>
        <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div class="form-foot">
          <button class="btn btn-ink" type="submit"><span class="btn-text">Send</span> <span class="arr"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"/></svg></span></button>
          <span class="hint">Or email <a href="mailto:hello@monaro8.com.au">hello@monaro8.com.au</a></span>
        </div>
        <div class="form-status" role="status" tabindex="-1"></div>
      </form>

      <aside class="contact-aside" aria-label="Direct details">
        <dl>
          <div><dt class="label">Base</dt><dd>Cooma NSW 2630<br><span class="mono" style="color:var(--ink-muted)">36.2355° S 149.1257° E · 795 M</span></dd></div>
          <div><dt class="label">Founder</dt><dd><a href="https://olivermoran.com.au" rel="noopener">Oliver Moran<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12L12 4M6 4h6v6"/></svg></a></dd></div>
          <div><dt class="label">Entity</dt><dd>Open County Pty Ltd<br>ABN 19 679 154 557</dd></div>
        </dl>
      </aside>
    </div>
  </section>
